name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, format, types and the unit suite across every supported interpreter, from the shared
  # workflow in PNX89/.github, pinned to a tag rather than a moving branch.
  #
  # `--locked` is kept: this repository resolves against a committed lockfile so a run cannot
  # quietly pick up a different resolution than the one that was tested.
  #
  # No playwright extra here, which is the point rather than an omission. The core has to lint,
  # type check and pass its unit suite with zero C extensions installed, which is also what makes
  # the 3.14 leg carry no wheel availability risk. The browser is a separate job below.
  #
  # mypy now runs on every leg rather than only on 3.13. That is a small increase and a real one:
  # what type checks on 3.14 is not what type checks on 3.11.
  #
  # What the pipeline is for, and the five things it deliberately does not gate, is at
  # https://github.com/PNX89/.github/blob/main/docs/adr/0001-what-ci-is-for.md
  checks:
    name: checks
    uses: PNX89/.github/.github/workflows/checks.yml@v1
    with:
      python-versions: '["3.11", "3.12", "3.13", "3.14"]'
      sync-args: "--locked --dev"
      run-mypy: true
      pytest-args: '-m "not e2e" -q'

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv python install 3.13
      - run: uv sync --locked --dev --group e2e --extra playwright
      # No actions/cache for ~/.cache/ms-playwright. Playwright's own CI docs say restoring
      # that cache takes about as long as downloading the binaries.
      - run: uv run playwright install --with-deps --only-shell chromium
      - run: uv run pytest -m e2e --tracing=retain-on-failure
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
