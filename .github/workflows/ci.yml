name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          # Sets UV_PYTHON, so `uv sync` cannot quietly pick the runner's system python.
          python-version: "3.13"
      - run: uv python install 3.13
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv python install ${{ matrix.python-version }}
      # No playwright extra, so this matrix installs zero C extensions and the 3.14 leg
      # carries no wheel availability risk.
      - run: uv sync --locked --dev
      - run: uv run pytest -m "not e2e" -q

  e2e:
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv python install 3.13
      - run: uv sync --locked --dev --group e2e --extra playwright
      # No actions/cache for ~/.cache/ms-playwright. Playwright's own CI docs say restoring
      # that cache takes about as long as downloading the binaries.
      - run: uv run playwright install --with-deps --only-shell chromium
      - run: uv run pytest -m e2e --tracing=retain-on-failure
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
